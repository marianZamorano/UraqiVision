# Estado de los issues según sus PR (reglas en ai/hooks/lib/estado-issues.mjs):
#   PR hacia dev: borrador → "en progreso"; lista → "en revisión"; fusionada (aceptada) → "en dev" y se cierra;
#   cerrada sin fusionar → se quitan "en progreso"/"en revisión".
#   PR hacia qa o main: al abrirla se crea su issue de promoción; al fusionarla, SOLO con la aprobación completa
#   (todos los colaboradores excepto el autor, sobre el último commit), los issues pasan a "en preproducción" o
#   "en producción" y se cierra el issue de promoción. Sin aprobación completa no cambia ningún estado.
# Para aplicar a mano una PR ya fusionada: gh workflow run estado-issues.yml --ref dev -f pr=<N>
name: Estado de issues

on:
  pull_request:
    branches: [dev, qa, main]
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Número de la PR a sincronizar
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  estado:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Actualizar issues de la PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: node ai/scripts/estado-issues.mjs --pr "$PR_NUMBER"
