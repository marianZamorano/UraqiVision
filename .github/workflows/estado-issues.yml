# Estado de los issues según sus PR (reglas en ai/hooks/lib/estado-issues.mjs):
#   PR abierta hacia dev → "estado: en revisión"; fusionada en dev → "estado: en dev";
#   fusionada en qa → "estado: en preproducción"; fusionada en main → "estado: en producción" y se cierra;
#   PR cerrada sin fusionar → se quita "estado: en revisión".
# GitHub solo cierra issues con "Closes #N" al fusionar en main; esto cubre también dev y qa.
name: Estado de issues

on:
  pull_request:
    branches: [dev, qa, main]
    types: [opened, reopened, closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  estado:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Actualizar issues de la PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node ai/scripts/estado-issues.mjs --pr "$PR_NUMBER"
