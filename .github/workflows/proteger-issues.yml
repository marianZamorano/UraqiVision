# Protección del estado de los issues (ai/scripts/proteger-issues.mjs). Revierte cambios manuales:
# - etiquetas "estado: …" puestas o quitadas a mano;
# - cerrar un issue de promoción sin que su PR se haya fusionado con la aprobación completa;
# - cerrar un issue con PR en curso (se cierra solo al aceptarla);
# - reabrir un issue cuya PR ya fue aceptada.
# Los eventos de issues corren con el workflow de la rama por defecto (main). Los cambios hechos por la
# automatización con GITHUB_TOKEN no disparan este workflow.
name: Protección de issues

on:
  issues:
    types: [closed, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  proteger:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Revisar el cambio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: node ai/scripts/proteger-issues.mjs
