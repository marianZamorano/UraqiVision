# Generado por ai/sync.mjs — no editar a mano; edita la fuente (ai/ o .agents/skills/) y ejecuta `node ai/sync.mjs`.
# Codex se lanza desde la raíz del repositorio. La capa .codex/ del proyecto (hooks incluidos) solo se carga
# si confías en el proyecto; revisa y confía los hooks con /hooks.

[mcp_servers.playwright]
# Navegador automatizado para PS-07, PS-08 y PS-09. Solo contra localhost salvo aprobación explícita.
command = "node"
args = ["ai/mcp/launch.mjs","playwright"]
default_tools_approval_mode = "prompt"

[mcp_servers.context7]
# Documentación vigente de librerías (CesiumJS, MapLibre GL JS, react-i18next, rasterio, xarray...) para no inventar APIs. Solo lectura. CONTEXT7_API_KEY es opcional (sube el límite de uso).
command = "node"
args = ["ai/mcp/launch.mjs","context7"]
env_vars = ["CONTEXT7_API_KEY"]
default_tools_approval_mode = "auto"

[mcp_servers.qa-evidence]
# Servidor propio de solo lectura (de chapterCoreIEEE): analiza resultados de pruebas JUnit, cobertura, esquemas JSON, contratos y quality gates dentro del repositorio. No ejecuta pruebas ni escribe archivos.
command = "node"
args = ["ai/qa/mcp-servers/qa-evidence/server.mjs"]
default_tools_approval_mode = "auto"

[mcp_servers.devops-readiness]
# Servidor propio de solo lectura (de chapterCoreIEEE): detecta el stack, revisa secretos por nombre, variables de entorno, planes gratuitos, preparación del despliegue y la política de aprobación de los agentes. No despliega ni modifica nada.
command = "node"
args = ["ai/devops/mcp-servers/devops-readiness/server.mjs"]
default_tools_approval_mode = "auto"
